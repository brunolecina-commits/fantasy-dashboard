name: Update dashboard
on:
  schedule:
    - cron: "*/10 17-23,0-5 * * *"   # every 10 minutes from noon to 1 AM Eastern, when games are on
    - cron: "23 6-16 * * *"          # hourly the rest of the day
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pull league from ESPN
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: node pull.mjs > raw.json
      - name: Build data files
        run: python3 build.py raw.json site/data
      - name: Projections, odds and daily history
        run: node analyze.mjs site/data history raw.json
      - name: Save the daily history snapshot
        run: |
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add history
          git diff --cached --quiet || (git commit -q -m "Daily history snapshot" && (git push || (git pull --rebase && git push)))
      - name: Stamp the code version so browsers pick up new page code
        run: sed -i "s/__V__/${GITHUB_SHA::8}/g" site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
